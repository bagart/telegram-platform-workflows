name: Tests (reusable)

on:
  workflow_call:
    inputs:
      php-version:
        description: PHP version
        type: string
        default: '8.5'

permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    # Same install posture as nightly: a clean checkout has no misc/ tree, so
    # bagart/* resolve as versioned VCS packages from composer.prod.json and
    # test/config paths are rewritten into vendor/ before the suite runs
    # (the old stub-strategy could not boot the real Feature suite).
    env:
      APP_KEY: base64:I7MrkZI5VQJnYLNLLclhvhFh5ggMajlW4cg8XSyB8R8=
      TG_MODULE_ENABLED_example: 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Install dependencies (prod manifest with dev tooling)
        run: |
          bash cmd/deps/install --mode=prod --dev --ignore-platform-req=ext-xhprof
          npm i

      - name: Map test/config paths to vendor (CI-only, Q12-A)
        run: php cmd/ci/rewrite-vendor-paths.php

      - name: Prepare environment
        run: cp .env.example .env

      # Inertia page tests resolve the Vite manifest.
      - name: Build assets
        run: npm run build

      - name: Tests
        run: ./vendor/bin/pest --testsuite Feature --compact

      - name: Skills sync check
        run: bash cmd/sync-skills --check
