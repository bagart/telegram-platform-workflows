name: Quality (reusable)

on:
  workflow_call:
    inputs:
      php-version:
        description: PHP version for tooling
        type: string
        default: '8.5'
      php-changes-only:
        description: Run PHP lint only when PHP surface changed
        type: boolean
        default: true
      frontend-changes-only:
        description: Run frontend lint only when frontend surface changed
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: linter-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup PHP
        if: inputs.php-changes-only || inputs.frontend-changes-only
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --ignore-platform-req=ext-xhprof

      - name: Pint (dirty surface)
        run: vendor/bin/pint --test --dirty

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Install Node dependencies
        run: npm i

      - name: ESLint
        run: npx eslint .

      - name: Prettier check
        run: npx prettier --check resources/
