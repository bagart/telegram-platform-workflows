name: Nightly (full suite + audits + coverage + mutation) (reusable)

on:
  workflow_call:
    inputs:
      php-version:
        description: PHP version
        type: string
        default: '8.5'

permissions:
  contents: read
jobs:
  full-suite:
    runs-on: ubuntu-latest
    # Live Redis for integration suites (bot-lib outbound queue, proxy audit
    # streams, ask-client connector); they target 127.0.0.1:6379 and their
    # no-server guards are not reachable without a server.
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_KEY: base64:I7MrkZI5VQJnYLNLLclhvhFh5ggMajlW4cg8XSyB8R8=
      TG_MODULE_ENABLED_example: 'false'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Install dependencies (prod manifest with dev tooling)
        run: |
          bash cmd/deps/install --mode=prod --dev --ignore-platform-req=ext-xhprof
          npm i

      - name: Map test/config paths to vendor (CI-only, Q12-A)
        run: php cmd/ci/rewrite-vendor-paths.php

      - name: Prepare environment
        # APP_KEY comes from the job env (needed by package:discover during
        # install); key:generate would refuse to rewrite a process-level key.
        run: cp .env.example .env

      - name: Build assets
        run: npm run build

      # Full application suite including all BAGArt library suites.
      - name: Full test suite (app + libraries)
        run: vendor/bin/pest --compact

      # Artifact scan layer (03 §10): bundles can leak secrets that are safe
      # at source level; public/build only exists after the asset build.
      - name: Artifact secret scan (built frontend bundles)
        run: bash tools/baseline/artifact-scan.sh

      - name: Frontend checks
        run: |
          npx prettier --check resources/
          npx tsc --noEmit

      - name: Dependency audits (composer + npm, all deps)
        run: |
          composer audit --abandoned=report
          npm audit --audit-level=high

      - name: Secret scan (full git history via gitleaks)
        # Blocking since 2026-08-24 decision: this is the only git-history
        # secret layer in CI; report-only mode let findings rot silently.
        # Flagged entries must be fixed or added to tools/baseline/secret-allowlist.json
        # (reason + expiry required).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0

      - name: Secret scan (working tree, built-in baseline scanner)
        run: php tools/baseline/secret-scan.php --all

      - name: Baseline tooling self-check
        run: |
          php tools/baseline/yaml-lint.php
          bash tools/baseline/shell-lint.sh

  coverage:
    # Coverage collection + threshold gate (04-qa-and-testing.md §15).
    # Blocking since 2026-10-03: floor 30 sits just below the measured
    # baseline (31.8% pcov / 32.1% xdebug — docs/questions/coverage-min-threshold.md);
    # raise it as coverage actually improves.
    runs-on: ubuntu-latest
    # Same integration requirements as full-suite: live Redis (no-server
    # guards unreachable otherwise) and built assets (Inertia page tests hit
    # the Vite manifest).
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BASELINE_COVERAGE_MIN: '30'
      APP_KEY: base64:I7MrkZI5VQJnYLNLLclhvhFh5ggMajlW4cg8XSyB8R8=
      TG_MODULE_ENABLED_example: 'false'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup PHP (pcov)
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer:v2
          coverage: pcov
          # pcov.directory defaults to auto (first of src/lib/app in cwd),
          # which picks repo app/ and silently drops every vendor/bagart
          # file from collection — report shows ~0% despite green tests.
          ini-values: pcov.directory=.

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Install dependencies (prod manifest with dev tooling)
        run: |
          bash cmd/deps/install --mode=prod --dev --ignore-platform-req=ext-xhprof
          npm i

      - name: Map test/config paths to vendor (CI-only, Q12-A)
        run: php cmd/ci/rewrite-vendor-paths.php

      - name: Prepare environment
        # APP_KEY comes from the job env (needed by package:discover during
        # install); key:generate would refuse to rewrite a process-level key.
        run: cp .env.example .env

      - name: Build assets
        run: npm run build

      - name: Coverage-gated suite (app + libs)
        run: vendor/bin/pest --coverage --min=${BASELINE_COVERAGE_MIN}

  mutation:
    # Mutation testing for the async kernel core (04-qa-and-testing.md §14).
    # Pest-native mutation engine against the AsyncKernelLib suite; the
    # minimum score comes from tools/baseline/mutation-baseline.json
    # (msi_floor 97.0, measured 100.00% — docs/questions/mutation-floor-enforcement.md).
    # Blocking since 2026-10-03. Runs are long, hence nightly-only.
    runs-on: ubuntu-latest
    env:
      APP_KEY: base64:I7MrkZI5VQJnYLNLLclhvhFh5ggMajlW4cg8XSyB8R8=
      TG_MODULE_ENABLED_example: 'false'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer:v2, pcov
          coverage: pcov
          # Same pcov.directory=auto trap as the coverage job: only app/
          # would be collected, so the mutation coverage report contains no
          # kernel files and covered-only filtering yields zero mutations.
          ini-values: pcov.directory=.

      - name: Install platform dependencies (prod manifest with dev tooling)
        run: bash cmd/deps/install --mode=prod --dev --ignore-platform-req=ext-xhprof

      - name: Map test/config paths to vendor (CI-only, Q12-A)
        run: php cmd/ci/rewrite-vendor-paths.php

      - name: Mutation testing (async kernel)
        run: bash cmd/dev/mutate
