name: Docker build/scan/publish (reusable)

on:
  workflow_call:
    inputs:
      php-version:
        description: PHP version
        type: string
        default: '8.5'
      push-image:
        description: Push image after scan (main/master/tags builds only)
        type: boolean
        default: false

permissions:
  contents: read
jobs:
  build-scan-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (no push yet)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./docker/common/php-fpm/Dockerfile
          push: false
          load: true
          tags: tg-bot-manager:${{ github.sha }}

      - name: Image scan (Trivy, gate on critical/high)
        uses: aquasecurity/trivy-action@1f0aa582c8c8f5f7639610d6d38baddfea4fdcee # v0.9.2
        with:
          image-ref: tg-bot-manager:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@f6c3d0fe42c3cf876e3462574e4c9416b5e0f07a # v0.9.0
        with:
          format: cyclonedx-json
          artifact-name: sbom.cdx.json

      - name: Image tag immutability policy (03 §38)
        run: bash tools/baseline/image-policy.sh

      - name: Push (main/master and tags only — build once, promote many)
        if: ${{ inputs.push-image }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./docker/common/php-fpm/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          provenance: mode=max
          sbom: true

      - name: Install cosign (digest-pinned release binary)
        run: |
          curl -fsSL -o /usr/local/bin/cosign \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  /usr/local/bin/cosign" | sha256sum -c -
          chmod +x /usr/local/bin/cosign
          cosign version

      # Keyless signing (03 §37): identity bound to the workflow OIDC claim;
      # verification is digest-based, so promotion consumes immutable refs only.
      - name: Sign pushed image (keyless)
        if: ${{ inputs.push-image }}
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: cosign sign --yes "$IMAGE"

      - name: Verify signature
        if: ${{ inputs.push-image }}
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          cosign verify "$IMAGE" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
