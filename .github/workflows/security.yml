name: Security (reusable)

on:
  workflow_call:
    inputs:
      php-version:
        description: PHP version
        type: string
        default: '8.5'
      export-sarif:
        description: Upload SARIF to code scanning (push builds only)
        type: boolean
        default: false

permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    env:
      BASELINE_DIR: ${{ github.workspace }}/misc/BAGArt/telegram-platform-devops-baseline
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Clone baseline package (separate git repo)
        run: |
          git clone --depth 1 https://github.com/bagart/telegram-platform-devops-baseline.git misc/BAGArt/telegram-platform-devops-baseline 2>/dev/null || true
          cd misc/BAGArt/telegram-platform-devops-baseline && composer install --no-interaction --prefer-dist --no-dev --no-scripts 2>/dev/null || true

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer:v2
          coverage: none

      - name: Composer audit
        run: composer audit --no-dev --locked --abandoned=report

      - name: SAST (Semgrep)
        env:
          SEMGREP_VERSION: ${{ vars.SEMGREP_VERSION || '1.56.0' }}
        run: |
          pipx install "semgrep==${SEMGREP_VERSION}" 2>/dev/null || pip install --quiet "semgrep==${SEMGREP_VERSION}"
          semgrep --version
          semgrep scan --error --metrics=off \
            --severity ERROR \
            --config tools/baseline/semgrep-rules.yml \
            --exclude '*/src/TgApi/*' --exclude vendor --exclude node_modules \
            app tests

      # Findings ingestion (03 §53): SARIF produced without --error so every
      # result lands in the report; the enforcing gate is the step above.
      - name: SAST SARIF export (push builds only)
        if: ${{ inputs.export-sarif }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEMGREP_VERSION: ${{ vars.SEMGREP_VERSION || '1.56.0' }}
        run: |
          pipx install "semgrep==${SEMGREP_VERSION}" 2>/dev/null || pip install --quiet "semgrep==${SEMGREP_VERSION}"
          semgrep scan --metrics=off \
            --config tools/baseline/semgrep-rules.yml \
            --exclude '*/src/TgApi/*' --exclude vendor --exclude node_modules \
            --sarif --output semgrep.sarif app tests || true
          PAYLOAD=$(jq -n --arg sha "${{ github.sha }}" --arg ref "${{ github.ref }}" \
                --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --arg uri "file://${PWD}" \
                --arg sarif "$(cat semgrep.sarif)" \
                '{commit_sha:$sha, ref:$ref, checkout_uri:$uri, started_at:$now, sarif:$sarif}')
          echo "$PAYLOAD" > sarif-payload.json
          gh api --method POST "repos/${{ github.repository }}/code-scanning/sarifs" \
            --input sarif-payload.json >/dev/null && echo "SARIF uploaded" \
            || echo "SARIF upload skipped (code scanning unavailable)"

      - name: Secret scan (built-in baseline scanner)
        run: php tools/baseline/secret-scan.php --all

      - name: Image tag policy (03 §38)
        run: bash tools/baseline/image-policy.sh

      - name: .env must not be tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by Git"
            exit 1
          fi
